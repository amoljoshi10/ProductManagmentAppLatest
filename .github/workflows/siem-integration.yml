name: SIEM Integration - Splunk
on:
  workflow_run:
    workflows: ["SAST - Static Application Security Testing",
                "SCA - Software Composition Analysis"]
    types: [completed]
  schedule:
    - cron: '0 6 * * *'
  workflow_call: {}
permissions:
  contents: read
  actions: read
jobs:
  forward-to-splunk:
    name: Forward Findings to Splunk HEC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send security findings to Splunk HEC
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD=$(printf '{"event":{"source":"github-actions","repository":"%s","workflow":"%s","run_id":"%s","sha":"%s","ref":"%s","timestamp":"%s"},"sourcetype":"github:actions:security","index":"security","host":"github.com"}' \
            "${{ github.repository }}" "${{ github.workflow }}" \
            "${{ github.run_id }}" "${{ github.sha }}" \
            "${{ github.ref }}" "${TIMESTAMP}")
          HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Splunk ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${{ secrets.SPLUNK_HEC_URL }}/services/collector/event")
          echo "Splunk HEC response: ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] && echo "Forwarded to Splunk" || echo "Warning: Splunk returned ${HTTP_CODE}"
        # Required GitHub secrets:
        #   SPLUNK_HEC_TOKEN — Splunk: Settings > Data Inputs > HTTP Event Collector > New Token
        #   SPLUNK_HEC_URL   — e.g. https://splunk.yourcompany.com:8088
